name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create release keystore from secret
        run: |
          set -euo pipefail
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew || true
          ./gradlew clean :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate release APK
        id: apk
        run: |
          set -euo pipefail
          echo "APK outputs:"
          find app/build/outputs -type f -name "*.apk" -print || true
          APK="$(find app/build/outputs -type f -name "*release*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          cp "$APK" InningsCapMaximizer-v1.6.7-b32.apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "${{ steps.apk.outputs.apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InningsCapMaximizer-v1.6.7-b32-apk
          path: InningsCapMaximizer-v1.6.7-b32.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: InningsCapMaximizer-v1.6.7-b32.apk
