name: Publish F-Droid Repo

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-fdroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build signed release APK
        env:
          FANTAG_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Build F-Droid repository folder
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo fdroid/metadata
          cp app/build/outputs/apk/release/app-release.apk fdroid/repo/InningsMax-${GITHUB_REF_NAME}.apk
          cp app/release.keystore fdroid/fdroid.keystore
          cat > fdroid/config.yml <<EOF2
          repo_name: Innings Max
          repo_description: Fantasy baseball innings-cap planner by North Star Labs.
          repo_icon: icon.png
          archive_older: 3
          keystore: fdroid.keystore
          repo_keyalias: ${KEY_ALIAS}
          keystorepass: ${KEYSTORE_PASSWORD}
          keypass: ${KEY_PASSWORD}
          EOF2
          cp app/src/main/assets/app_logo.png fdroid/icon.png
          cat > fdroid/metadata/com.northstarlabs.inningsmax.yml <<EOF2
          Categories:
            - Sports & Health
          License: Proprietary
          AuthorName: North Star Labs
          WebSite: https://fantag.sidneyshelton.com
          SourceCode: https://github.com/${GITHUB_REPOSITORY}
          IssueTracker: https://github.com/${GITHUB_REPOSITORY}/issues
          Summary: Fantasy baseball innings-cap planner
          Description: |-
            Innings Max is an Android app for fantasy baseball innings-cap planning, SP/RP tradeoff decisions, and pre-Sunday strategy.
          AutoName: Innings Max
          Builds: []
          EOF2
          cd fdroid
          fdroid update --create-metadata --pretty
          rm -f fdroid.keystore config.yml

      - name: Publish F-Droid repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./fdroid
          keep_files: true
