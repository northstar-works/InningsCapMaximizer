name: Publish F-Droid Repo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-fdroid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
        with:
          gradle-version: 8.7

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew || true
          ./gradlew clean :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate release APK
        id: apk
        run: |
          set -euo pipefail
          echo "APK outputs:"
          find app/build/outputs -type f -name "*.apk" -print || true
          APK="$(find app/build/outputs -type f -name "*release*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          mkdir -p fdroid/repo
          cp "$APK" fdroid/repo/InningsCapMaximizer-v1.6.7-b32.apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "${{ steps.apk.outputs.apk }}"

      - name: Build F-Droid repository folder
        run: |
          set -euo pipefail
          cd fdroid
          cat > repo/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Innings Cap Maximizer F-Droid Repo</title>
            </head>
            <body>
              <h1>Innings Cap Maximizer</h1>
              <p>Download the current APK:</p>
              <p><a href="InningsCapMaximizer-v1.6.7-b32.apk">InningsCapMaximizer-v1.6.7-b32.apk</a></p>
            </body>
          </html>
          HTML

      - name: Publish F-Droid repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid
          publish_branch: gh-pages
          force_orphan: true
